version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: esporthub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - esporthub-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: esporthub-admin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - '8080:80'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - esporthub-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: esporthub-backend
    restart: always
    command: >
      sh -c "
      npx wait-port db:3306 &&
      npm run db:init &&
      npm start
      "
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - '5000:5000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - esporthub-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: esporthub-frontend
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - esporthub-network

networks:
  esporthub-network:
    driver: bridge

volumes:
  mysql_data:
